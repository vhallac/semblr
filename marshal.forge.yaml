branch: main
ci:
  template: node
  required_checks: [ci]
review:
  count: 1
auto_merge: false
routing:
  rules:
    - match: {complexity: L1}
      plan: {formula: marshal-fix, agent: marshal-standard}
    - match: {kind: research}
      plan: {formula: marshal-research, agent: marshal-reasoning}
  default: {formula: marshal-sdlc, agent: marshal-standard}
accounts:
  codex: [marshal]
